<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Last Word</title>
<meta name="description" content="Last Word — live experiences & creative.">
<meta property="og:title" content="Last Word">
<meta property="og:description" content="Live experiences &amp; creative.">
<meta property="og:image" content="card-hero.jpg">
<meta name="theme-color" content="#E6DED5">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='6' fill='%233B4033'/%3E%3C/svg%3E">
<link rel="preload" as="image" href="card-hero.webp" type="image/webp">
<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#E3DBD2;overflow:hidden}

  .stage{
    position:fixed;inset:0;overflow:hidden;
    /* table tone continues past the photo edges on tall screens */
    background:linear-gradient(180deg,#EBE3DA 0%,#E2D9CF 55%,#D9D0C5 100%);
  }

  /* the photograph */
  .photo{
    position:absolute;left:50%;top:50%;
    width:max(100vw, 150vh);            /* cover on wide screens */
    aspect-ratio:1728/1152;
    transform:translate(-50%,-50%);
    animation:breathe 38s ease-in-out infinite alternate;
    will-change:transform;
  }
  .photo picture,.photo img{display:block;width:100%;height:100%}
  .photo img{object-fit:cover;opacity:0;animation:arrive 2.4s cubic-bezier(.25,.6,.3,1) .15s forwards}

  /* tall screens: keep the whole card in view and let the table run past the photo */
  @media (max-aspect-ratio: 1/1){
    .photo{width:235vw}
    .photo img{
      -webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 14%,#000 86%,transparent 100%);
              mask-image:linear-gradient(180deg,transparent 0%,#000 14%,#000 86%,transparent 100%);
    }
  }

  /* passing light, like a cloud moving past the window */
  .weather{
    position:absolute;inset:-20%;pointer-events:none;
    background:linear-gradient(115deg, rgba(60,48,36,0) 30%, rgba(60,48,36,.10) 50%, rgba(60,48,36,0) 70%);
    mix-blend-mode:multiply;opacity:0;
    animation:cloud 26s ease-in-out 3s infinite;
  }

  /* living film grain */
  .grain{
    position:absolute;inset:-50%;width:200%;height:200%;pointer-events:none;opacity:.10;mix-blend-mode:multiply;
    animation:grain 1.2s steps(6) infinite;
  }

  @keyframes arrive{from{opacity:0;filter:blur(6px) brightness(1.08)}to{opacity:1;filter:none}}
  @keyframes breathe{
    0%  {transform:translate(-50%,-50%) scale(1.000) rotate(0deg)}
    50% {transform:translate(-50.4%,-49.7%) scale(1.018) rotate(.12deg)}
    100%{transform:translate(-49.7%,-50.3%) scale(1.032) rotate(-.08deg)}
  }
  @keyframes cloud{
    0%  {opacity:0;transform:translateX(-18%)}
    45% {opacity:1}
    100%{opacity:0;transform:translateX(18%)}
  }
  @keyframes grain{
    0%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-3%)}
    60%{transform:translate(-2%,-1%)}80%{transform:translate(3%,2%)}100%{transform:translate(0,0)}
  }

  @media (prefers-reduced-motion: reduce){
    .photo,.weather,.grain{animation:none}
    .photo img{animation:none;opacity:1}
    .weather{display:none}
  }
</style>
</head>
<body>
<main class="stage">
  <div class="photo">
    <picture>
      <source srcset="card-hero.webp" type="image/webp">
      <img src="card-hero.jpg" width="1728" height="1152" alt="A Last Word business card, olive green with embossed lettering reading Last Word, Live Experiences &amp; Creative, resting on a sunlit table.">
    </picture>
  </div>
  <div class="weather" aria-hidden="true"></div>
  <svg class="grain" aria-hidden="true"><filter id="g"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#g)"/></svg>
</main>
</body>
</html>
